name: Generate SBOM

on:
  workflow_dispatch:
    inputs:
      image-name:
        description: >-
          Docker image name to use to generate sbom from
        type: string
        required: true
      image-version:
        description: >-
          The version of the image to generate sbom from
        type: string
        required: false
        default: ""
      upload-sbom:
        description: >-
          Whether to upload the sbom to the repository
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      image-name:
        description: >-
          Docker image name to use to generate sbom from
        type: string
        required: true
      image-version:
        description: >-
          The version of the image to generate sbom from
        type: string
        required: false
        default: ""
      upload-sbom:
        description: >-
          Whether to upload the sbom to the repository
        type: boolean
        required: false
        default: false
  
jobs:
  generate-sbom:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Private Go Environment
        uses: ./.github/actions/setup-go
        with:
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: Login to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate sbom for metalk8s-registry-node-agent
        uses: scality/sbom@e44e161a0321c285b7437be5b8de46b18a1ecb5c # v2.1.4
        with:
          target: ${{ inputs.image-name }}
          target_type: image
          version: ${{ inputs.image-version }}
          output_dir: /tmp
          output_file: sbom.json

      - name: Upload sbom to repository
        if: inputs.upload-sbom == true
        uses: scality/sbom-upload@61aa17125ab1475f19d39dcb397902b283a60649 # v1.0.8
        with:
          url: ${{ vars.DEPENDENCY_TRACK_HOSTNAME }}
          api-key: ${{ secrets.DEPENDENCY_TRACK_APIKEY }}
          project-sbom: /tmp/sbom.json
          parent-project-name: ${{ github.repository }}
          parent-project-collection-logic: "NONE"
