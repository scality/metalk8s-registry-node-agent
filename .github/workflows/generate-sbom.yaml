name: Generate SBOM

on:
  workflow_dispatch:
    inputs:
      image-name:
        description: >-
          Docker image name to use to generate sbom from
        type: string
        required: true
      image-version:
        description: >-
          The version of the image to generate sbom from
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      image-name:
        description: >-
          Docker image name to use to generate sbom from
        type: string
        required: true
      image-version:
        description: >-
          The version of the image to generate sbom from
        type: string
        required: false
        default: ""
  
jobs:
  generate-sbom:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to the registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate sbom for metalk8s-registry-node-agent
        uses: scality/sbom@e44e161a0321c285b7437be5b8de46b18a1ecb5c # v2.1.4
        with:
          target: ${{ inputs.image-name }}
          target_type: image
          version: ${{ inputs.image-version }}
          output_dir: /tmp
          output_file: sbom.json
