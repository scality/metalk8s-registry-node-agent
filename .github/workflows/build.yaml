name: "Build"

on:
  workflow_call:
    inputs:
      is-development:
        description: "Whether the build is for development purposes or not"
        required: false
        default: true
        type: boolean
      is-latest:
        description: "Whether the build is for the latest tag or not"
        required: false
        default: false
        type: boolean
      is-stable:
        description: "Whether the build is for a stable release or not"
        required: false
        default: false
        type: boolean
    outputs:
      image-name:
        description: "The full image name with tag"
        value: ${{ jobs.build.outputs.image-name }}
      image-version:
        description: "The version of the image"
        value: ${{ jobs.build.outputs.image-version }}

jobs:
  build:
    outputs:
      image-name: ${{ steps.tags.outputs.tags }}
      image-version: ${{ steps.tags.outputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # NOTE: We fetch depth so that we can put the right `GIT` reference
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to the registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        # If `is-development` then suffix tag with `-dev`
        # If `is-latest` then add `latest` tag
        # If not `is-stable` then suffix `-dev` to `latest
        run: |
          version="$(git describe --tags --always --dirty --match='v[0-9]*')${{ inputs.is-development && '-dev' || '' }}"
          tags="ghcr.io/${{ github.repository }}:${version}"
          if [ "${{ inputs.is-latest }}" = "true" ]; then
            tags="$tags,ghcr.io/${{ github.repository }}:latest${{ ! inputs.is-stable && '-dev' || '' }}"
          fi
          echo "tags=$tags" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args:
            APPLICATION_VERSION=${{ steps.tags.outputs.version }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=metalk8s-registry-node-agent
          cache-to: type=gha,mode=max,scope=metalk8s-registry-node-agent
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GIT_ACCESS_TOKEN }}

  upload-artifacts:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # NOTE: We fetch depth so that we can put the right `GIT` reference
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Private Go Environment
        uses: ./.github/actions/setup-go
        with:
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: Build manifest and CRDs
        run: |
          make build-installer IMG=$(echo "${{ needs.build.outputs.image-name }}" | cut -d',' -f1)
          make build-crds

      - name: Upload artifacts
        uses: scality/action-artifacts@b311c0a0d8017683148906bd3fbe0e681b115608 # 4.3.0
        with:
          url: https://artifacts.scality.net
          user: ${{ secrets.ARTIFACTS_USER }}
          password: ${{ secrets.ARTIFACTS_PASSWORD }}
          source: ./dist
          method: upload
