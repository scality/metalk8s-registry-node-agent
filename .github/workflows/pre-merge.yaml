name: "Pre Merge"

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

env:
  GO_VERSION: "1.24"

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    with:
      is-development: true
      is-latest: false
      is-stable: false

  go-generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Ensure go generate as been run if needed
        # We run go generate and then check if there are any changes
        run: |
          go generate ./... &&
          git diff --quiet

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run linters
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.3.1
