openapi: 3.0.3
info:
  title: Upload solution archives for MetalK8s
  description: "Upload solution archives for MetalK8s"
  version: 1.0.0
servers:
  - url: https://IP:5001/api/v1/
paths:
  /uploads/{solutionArchive}/{version}:
    put:
      summary: Upload the chunk of the solution archive.
      operationId: uploadChunk
      parameters:
        - name: solutionArchive
          in: path
          description: Name of the solution archive
          required: true
          schema:
            type: string
        - name: version
          in: path
          description: Version of the solution archive
          required: true
          schema:
            type: string
        - name: Content-Range
          in: header
          description: >-
            Range of the chunk to upload. Should respect the format `bytes <start-index>-<end-index>/<total-size-in-bytes>`
          required: true
          example: bytes 0-2/4
          schema:
            type: string
      requestBody:
        description: Upload one chunk
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadChunkSuccessResponse"
              examples:
                incomplete:
                  $ref: "#/components/examples/IncompleteUpload"
                complete:
                  $ref: "#/components/examples/CompletedUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/ServerError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
components:
  responses:
    BadRequest:
      description: |-
        The request was malformed or could not be processed. 

        Examples of `Bad Request` problem detail responses:

         - [Missing body property](https://problems-registry.smartbear.com/missing-body-property/)
         - [Invalid body property format](https://problems-registry.smartbear.com/invalid-body-property-format/)
         - [Invalid body property value](https://problems-registry.smartbear.com/invalid-body-property-value/)
         - [Missing request header](https://problems-registry.smartbear.com/missing-request-header/)
         - [Invalid request header format](https://problems-registry.smartbear.com/invalid-request-header-format/)
         - [Missing request parameter](https://problems-registry.smartbear.com/missing-request-parameter/)         
         - [Invalid request parameter format](https://problems-registry.smartbear.com/invalid-request-parameter-format/)
         - [Invalid request parameter value](https://problems-registry.smartbear.com/invalid-request-parameter-value/)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            missingBodyProperty:
              $ref: "#/components/examples/missing-body-property"
            missingBodyPropertyWithErrors:
              $ref: "#/components/examples/missing-body-property-with-errors"
            missingRequestParameter:
              $ref: "#/components/examples/missing-request-parameter"
            missingRequestParameterWithErrors:
              $ref: "#/components/examples/missing-request-parameter-with-errors"
            missingRequestHeader:
              $ref: "#/components/examples/missing-request-header"
            missingRequestHeaderWithErrors:
              $ref: "#/components/examples/missing-request-header-with-errors"
            invalidBodyPropertyFormat:
              $ref: "#/components/examples/invalid-body-property-format"
            invalidBodyPropertyFormatWithErrors:
              $ref: "#/components/examples/invalid-body-property-format-with-errors"
            invalidRequestHeaderFormat:
              $ref: "#/components/examples/invalid-request-header-format"
            invalidRequestHeaderFormatWithErrors:
              $ref: "#/components/examples/invalid-request-header-format-with-errors"
            invalidBodyPropertyValue:
              $ref: "#/components/examples/invalid-body-property-value"
            invalidBodyPropertyValueWithErrors:
              $ref: "#/components/examples/invalid-body-property-value-with-errors"
    Unauthorized:
      description: Access token is not set or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            unauthorized:
              $ref: "#/components/examples/unauthorized"
    Forbidden:
      description: The requestor is not authorized to perform this operation on the resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            forbidden:
              $ref: "#/components/examples/forbidden"
    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            notFound:
              $ref: "#/components/examples/not-found"

    UnprocessableEntity:
      description: The request was malformed or could not be processed. 
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            unprocessableEntity:
              $ref: "#/components/examples/unprocessable-entity"
    ServerError:
      description: The server encountered an unexpected error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            serverError:
              $ref: "#/components/examples/server-error"
    InsufficientStorage:
      description: The server is unable to store the representation needed to successfully complete the request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            serverError:
              $ref: "#/components/examples/insufficient-storage"
  schemas:
    UploadChunkRange:
      type: object
      properties:
        rangeStartIndex:
          type: integer
        rangeEndIndex:
          type: integer
        rangeSize:
          type: integer
    IncompleteSolutionArchive:
      type: object
      properties:
        version:
          type: string
        solutionArchive:
          type: string
        sha256sum:
          type: string
        size:
          type: integer
        uploadedChunks:
          type: array
          items:
            $ref: "#/components/schemas/UploadChunkRange"
    UploadChunkSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/IncompleteSolutionArchive"
        - type: object
          properties:
            isCompleted:
              type: boolean
              description: Indicates if the upload is complete.
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
          format: uri
          maxLength: 1024
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          format: int32
          minimum: 100
          maximum: 599
        title:
          type: string
          description: >-
            A short, human-readable summary of the problem type. It should not change from occurrence to occurrence of the problem, except for purposes of localization.
          maxLength: 1024
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          maxLength: 4096
        instance:
          type: string
          description: >-
            A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
          maxLength: 1024
        code:
          type: string
          description: >-
            An API specific error code aiding the provider team understand the error based on their own potential taxonomy or registry.
          maxLength: 50
        additionalInformation:
          type: object
          description: A map containing flexible metadata or contextual details about the error.
          additionalProperties: true # Allows keys of string to map to any type of value
          example:
            invalidFields: ["email", "zipCode"]
            timestamp: "2026-05-21T08:14:00Z"
            internalId: 98765
      required:
        - title
  examples:
    IncompleteUpload:
      description: Representation of an Incompleted Component upload
      value:
        version: 127.0.2
        path: metalk8s.iso
        sha256sum: "<sha>"
        size: 6
        uploadedParts:
          - rangeStartIndex: 0
            rangeEndIndex: 1
            rangeSize: 2
          - rangeStartIndex: 2
            rangeEndIndex: 3
            rangeSize: 2
        isCompleted: false
    CompletedUpload:
      description: Representation of a Completed Component upload
      value:
        version: 127.0.2
        path: metalk8s.iso
        sha256sum: "<sha>"
        size: 6
        uploadedParts:
          - rangeStartIndex: 0
            rangeEndIndex: 1
            rangeSize: 2
          - rangeStartIndex: 2
            rangeEndIndex: 3
            rangeSize: 2
          - rangeStartIndex: 4
            rangeEndIndex: 5
            rangeSize: 2
        isCompleted: true
    missing-body-property:
      description: Representation of a 400 Bad Request response where a rquired `body` property was omitted by the consumer.
      value:
        type: https://problems-registry.smartbear.com/missing-body-property
        status: 400
        title: Missing body property
        detail: The request is missing an expected body property.
        code: 400-09
    missing-body-property-with-errors:
      description: Representation of a 400 Bad Request response where a rquired `body` property was omitted by the consumer.
      value:
        type: https://problems-registry.smartbear.com/missing-body-property
        status: 400
        title: Missing body property
        detail: The request is missing an expected body property.
        code: 400-09
        errors:
          - detail: The body property {name} is required.
            pointer: /name
    missing-request-parameter:
      description: Representation of a 400 Bad Request response where a `query` or `path` parameter was omitted by the consumer.
      value:
        type: https://problems-registry.smartbear.com/missing-request-parameter
        status: 400
        title: Missing request parameter
        detail: The request is missing an expected query or path parameter.
        code: 400-03
    missing-request-parameter-with-errors:
      description: Representation of a 400 Bad Request response where a `query` or `path` parameter was omitted by the consumer.
      value:
        type: https://problems-registry.smartbear.com/missing-request-parameter
        status: 400
        title: Missing request parameter
        detail: The request is missing an expected query or path parameter.
        code: 400-03
        errors:
          - detail: The query parameter {name} is required.
            parameter: name
    missing-request-header:
      description: Representation of a 400 Bad Request response where a `header` parameter was omitted by the consumer.
      value:
        type: https://problems-registry.smartbear.com/missing-request-header
        status: 400
        title: Missing request header
        detail: The request is missing an expected HTTP request header.
