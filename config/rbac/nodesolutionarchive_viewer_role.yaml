# This rule is not used by the project metalk8s-registry-node-agent itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to metalk8s.scality.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: metalk8s-registry-node-agent
    app.kubernetes.io/managed-by: kustomize
  name: nodeartifact-viewer-role
rules:
- apiGroups:
  - metalk8s.scality.com
  resources:
  - nodeartifacts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - metalk8s.scality.com
  resources:
  - nodeartifacts/status
  verbs:
  - get
