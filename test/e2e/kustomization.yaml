resources:
- ../../config/default
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/ports/1/hostPort
      value: 5002
    - op: remove
      path: /spec/template/spec/nodeSelector/node-role.kubernetes.io~1registry
    - op: add
      path: /spec/template/spec/nodeSelector/role
      value: "worker"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: MOUNT_WATCHER_POLL_TIMEOUT_MS
        value: "600000"
  target:
    kind: StatefulSet
- path: tls_volumes_patch.yaml
  target:
    kind: StatefulSet
- path: emptydir_volumes_patch.yaml
  target:
    kind: StatefulSet
- path: security_context_patch.yaml
  target:
    kind: StatefulSet
