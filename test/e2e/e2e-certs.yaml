---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: test-e2e-selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-e2e-ca
spec:
  isCA: true
  commonName: "Test-E2E CA"
  secretName: test-e2e-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: Issuer
    name: test-e2e-selfsigned-issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: test-e2e-issuer
spec:
  ca:
    secretName: test-e2e-ca-secret
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-certs
spec:
  ipAddresses:
  - "127.0.0.1"
  - "172.18.0.1"
  - "172.18.0.2"
  - "172.18.0.3"
  - "172.18.0.4"
  - "172.19.0.1"
  - "172.19.0.2"
  - "172.19.0.3"
  - "172.19.0.4"
  - "172.20.0.1"
  - "172.20.0.2"
  - "172.20.0.3"
  - "172.20.0.4"
  - "172.21.0.1"
  - "172.21.0.2"
  - "172.21.0.3"
  - "172.21.0.4"
  - "172.22.0.1"
  - "172.22.0.2"
  - "172.22.0.3"
  - "172.22.0.4"
  dnsNames:
  - "*"
  - "localhost"
  issuerRef:
    kind: Issuer
    name: test-e2e-issuer
  secretName: tls-cert
  commonName: "Test-E2E"
  usages:
  - server auth
  - client auth
